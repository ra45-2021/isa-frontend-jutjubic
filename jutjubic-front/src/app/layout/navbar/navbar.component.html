<header class="topbar">
  <div class="left">
    <button class="icon-btn" type="button" (click)="toggleSidebar()" aria-label="Toggle menu">
      <span class="hamburger">
        <span></span><span></span><span></span>
      </span>
    </button>

    <a class="brand-link" routerLink="/home" aria-label="Go to Home">
      <div class="brand">
        <img class="brand-logo" src="assets/logo2.png" alt="Logo" />
        <div class="brand-title">JutJubic</div>
      </div>
    </a>
  </div>

  <div class="right">
    <ng-container *ngIf="authService.isLoggedIn(); else loginBtn">

      <a routerLink="/upload" class="upload-btn">+ Create</a>

      <div class="profile-menu" (click)="$event.stopPropagation()">
        <button class="profile-btn" type="button" (click)="toggleProfileMenu($event)" aria-label="Open profile menu">
          <img
            class="profile-img"
            [src]="profileImgSrc()"
            (error)="imgFallback($event)"
            alt="Profile"
          />
        </button>

        <div class="menu" *ngIf="profileMenuOpen">
          <button class="menu-item" type="button" (click)="goMyProfile()">My Profile</button>
          <div class="menu-sep"></div>
          <button class="menu-item danger" type="button" (click)="logout()">Log Out</button>
        </div>
      </div>

    </ng-container>

    <ng-template #loginBtn>
      <a class="login-btn" routerLink="/login">Log In</a>
    </ng-template>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" [class.open]="sidebarOpen">

  <a class="side-item" routerLink="/home">
    <img class="side-icon" src="assets/home.png" alt="Home" />
    <span class="side-text">Home</span>
  </a>

  <a class="side-item" routerLink="/watch-parties">
    <img class="side-icon" src="assets/watch-party.png" alt="Watch Parties" />
    <span class="side-text">Watch Party</span>
  </a> 

</aside>

  <div class="content-spacer"></div>
</div>
