<!-- Top bar -->
<header class="topbar">
  <div class="left">
    <button class="icon-btn" type="button" (click)="toggleSidebar()" aria-label="Toggle menu">
      <span class="hamburger">
        <span></span><span></span><span></span>
      </span>
    </button>

    <a class="brand-link" routerLink="/home" aria-label="Go to Home">
      <div class="brand">
        <img class="brand-logo" src="assets/logo2.png" alt="Logo" />
        <div class="brand-title">JutJubic</div>
      </div>
    </a>
  </div>

  <div class="right">
  <ng-container *ngIf="authService.isLoggedIn(); else loginBtn">
    <a routerLink="/upload" class="upload-btn">UPLOAD</a>
    <a routerLink="/profile">
      <img class="profile-img" src="assets/profile.png" alt="Profile" />
    </a>
    <button (click)="authService.logout()" class="logout-link">LOGOUT</button>
  </ng-container>

  <ng-template #loginBtn>
    <a class="login-btn" routerLink="/login">LOG IN</a>
  </ng-template>
  </div>
</header>


<!-- Layout: sidebar + page content -->
<div class="shell">
  <aside class="sidebar" [class.open]="sidebarOpen">
    <a class="side-item" routerLink="/home">
      <img class="side-icon" src="assets/icon.png" alt="" />
      <span class="side-text">Placeholder 1</span>
    </a>

    <a class="side-item" routerLink="/home">
      <img class="side-icon" src="assets/icon.png" alt="" />
      <span class="side-text">Placeholder 2</span>
    </a>

    <a class="side-item" routerLink="/home">
      <img class="side-icon" src="assets/icon.png" alt="" />
      <span class="side-text">Placeholder 3</span>
    </a>
  </aside>

  <div class="content-spacer"></div>
</div>
