<p *ngIf="loading" class="muted">Loading posts...</p>
<p *ngIf="error" class="error">{{ error }}</p>

<div class="grid" *ngIf="!loading && !error">
  <div *ngFor="let p of posts" class="post">

    <div class="media">
      <button class="thumb" type="button" aria-label="Video placeholder">
        <img
          *ngIf="p.thumbnailUrl; else noThumb"
          class="thumb-img"
          [src]="p.thumbnailUrl!"
          [alt]="p.title + ' thumbnail'"
          loading="lazy"
        />

        <ng-template #noThumb>
          <div class="thumb-fallback">No thumbnail</div>
        </ng-template>

        <div class="play-overlay">
          <div class="play-btn">
            <span class="play-triangle"></span>
          </div>
        </div>
      </button>
    </div>

    <div class="meta">
      <div class="row1">
        <a class="avatar-link" [routerLink]="['/profile', p.author.username]">
          <img
            class="avatar"
            [src]="avatarSrc(p.author)"
            alt="Profile"
            (error)="imgFallback($event)"
            loading="lazy"
          />
        </a>

        <div class="title" title="{{ p.title }}">{{ p.title }}</div>
        <div class="time">{{ timeLabel(p.createdAt) }}</div>
      </div>

      <div class="row2">
        <a class="username" [routerLink]="['/profile', p.author.username]">
          {{ p.author.username }}
        </a>

        <div *ngIf="hasTags(p)" class="tags">
          <span *ngFor="let t of p.tags" class="tag">#{{ t }}</span>
        </div>
      </div>

      <div class="row3">
        <!-- LIKE stays SAME -->
        <button class="action" type="button" (click)="actionGuard()">
          <img class="action-ico" src="assets/like.png" alt="" />
          <span>Like</span>
        </button>

        <!-- COMMENTS: anyone can click; toggles panel -->
        <button class="action" type="button" (click)="toggleComments(p.id)">
          <img class="action-ico" src="assets/comment.png" alt="" />
          <span>Comments</span>
        </button>
      </div>

      <!-- Sliding popup below -->
      <div class="comments-panel" [class.open]="openCommentsPostId === p.id">
        <div class="comments-inner">

          <div class="comment-compose">
            <input
              class="comment-input"
              type="text"
              [value]="commentDraft[p.id] || ''"
              (input)="commentDraft[p.id] = ($any($event.target).value)"
              (click)="onCommentInputClick()"
              placeholder="Write a comment..."
            />

            <button class="comment-post" type="button" (click)="postComment(p.id)">
              Post
            </button>
          </div>

          <div *ngIf="commentsError[p.id]" class="comment-error">
            {{ commentsError[p.id] }}
          </div>

          <div *ngIf="commentsLoading[p.id]" class="comment-loading">
            Loading...
          </div>

          <ng-container *ngIf="openCommentsPostId === p.id">
            <div *ngIf="getCurrentCommentsPage(p.id) as page">
              <div *ngFor="let c of page.items" class="comment-item">
                <div class="comment-head">
                  <div class="comment-author">{{ c.authorUsername }}</div>
                  <div class="comment-date">{{ commentTime(c.createdAt) }}</div>
                </div>

                <div class="comment-text">{{ c.text }}</div>
              </div>

              <div class="comment-pager" *ngIf="page.totalPages > 1">
                <button
                  class="pager-btn"
                  type="button"
                  (click)="prevComments(p.id)"
                  [disabled]="page.page === 0"
                >
                  Prev
                </button>

                <div class="pager-info">{{ page.page + 1 }} / {{ page.totalPages }}</div>

                <button
                  class="pager-btn"
                  type="button"
                  (click)="nextComments(p.id)"
                  [disabled]="page.page + 1 >= page.totalPages"
                >
                  Next
                </button>
              </div>
            </div>
          </ng-container>

        </div>
      </div>

    </div>

  </div>
</div>
